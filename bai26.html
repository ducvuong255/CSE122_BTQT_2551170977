<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 26 — Form đăng ký với Bootstrap</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #eef2f5;
    }
    .custom-header {
      background-color: #198754; /* bg-success (#198754) */
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- Thẻ form đặt trong Card với bóng đổ và bo góc -->
        <div class="card shadow rounded-3">
          <!-- Card Header nền xanh, chữ trắng, căn giữa -->
          <div class="card-header custom-header text-center py-3">
            <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
          </div>

          <!-- Card Body chứa Form -->
          <div class="card-body p-4">
            <form action="#" method="POST" class="needs-validation">
              <div class="row g-3">
                
                <!-- Họ và tên -->
                <div class="col-12 col-md-6">
                  <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                  <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                </div>

                <!-- Mã sinh viên -->
                <div class="col-12 col-md-6">
                  <label for="studentId" class="form-label fw-semibold">Mã sinh viên</label>
                  <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                </div>

                <!-- Email -->
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label fw-semibold">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                </div>

                <!-- Số điện thoại -->
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                  <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                </div>

                <!-- Trình độ (Radio buttons inline) -->
                <div class="col-12">
                  <label class="form-label fw-semibold d-block">Trình độ</label>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Cơ bản" checked required>
                    <label class="form-check-label" for="levelBasic">Cơ bản</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="level" id="levelIntermediate" value="Khá">
                    <label class="form-check-label" for="levelIntermediate">Khá</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="level" id="levelAdvanced" value="Tốt">
                    <label class="form-check-label" for="levelAdvanced">Tốt</label>
                  </div>
                </div>

                <!-- Chọn lớp (form-select) -->
                <div class="col-12">
                  <label for="classSelect" class="form-label fw-semibold">Chọn lớp</label>
                  <select class="form-select" id="classSelect" required>
                    <option value="67CNTT1" selected>67CNTT1</option>
                    <option value="67CNTT2">67CNTT2</option>
                    <option value="67CNTT3">67CNTT3</option>
                  </select>
                </div>

                <!-- Checkbox Cam kết -->
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="commitment" checked required>
                    <label class="form-check-label" for="commitment">
                      Tôi cam kết tự làm bài và quay video OBS
                    </label>
                  </div>
                </div>

                <!-- Nút bấm (Nhập lại & Đăng ký) -->
                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                  <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                  <button type="submit" class="btn btn-success px-4" style="background-color: #198754;">Đăng ký</button>
                </div>

              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
