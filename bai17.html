<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="bai17.css">
</head>
<body>

    <div class="register-card">
        <div class="header">
            <h2>Đăng ký tài khoản</h2>
            <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" value="Nguyễn Văn An">
                <div class="msg" id="msg-fullname"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email" value="an.nv@">
                <div class="msg" id="msg-email"></div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" value="123">
                <div class="msg" id="msg-password"></div>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" value="123456">
                <div class="msg" id="msg-confirm-password"></div>
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>
    </div>

    <script src="bai17.js"></script>
</body>
</html>
