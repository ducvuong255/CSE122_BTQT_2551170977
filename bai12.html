<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch theo ngày</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>

    <div class="main-container">
        <div class="calendar-box">
            <div id="year-display" class="year-text">2026</div>
            <div id="month-display" class="month-text">Tháng 12</div>
            <div id="day-display" class="day-text">24</div>
            <div id="weekday-display" class="weekday-text">Thứ hai</div>
        </div>

        <div id="greeting-display" class="greeting-text">Chào buổi sáng!</div>

        <div class="form-box">
            <div class="input-group">
                <label>Ngày</label>
                <input type="number" id="input-day" value="24" min="1" max="31">
            </div>
            <div class="input-group">
                <label>Tháng</label>
                <input type="number" id="input-month" value="12" min="1" max="12">
            </div>
            <div class="input-group">
                <label>Năm</label>
                <input type="number" id="input-year" value="2026">
            </div>
            <button id="print-btn">In<br>lịch</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
